spring.application.name=payments-api
server.port=8080

spring.datasource.url=jdbc:h2:mem:payments;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.sql.init.mode=always

# Secrets come from the environment, never from source control.
paygate.api-key=${PAYGATE_API_KEY:}
card.fingerprint-key=${CARD_FINGERPRINT_KEY:}
