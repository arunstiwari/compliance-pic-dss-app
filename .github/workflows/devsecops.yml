name: DevSecOps compliance pipeline

# Every PR runs the security stages in parallel, then the compliance gate maps the
# results to PCI DSS v4.0.1 and ISO/IEC 27001:2022 controls (compliance/controls.yaml),
# writes the matrix to the job summary and a PR comment, and blocks the merge if a
# blocking control fails.
#
# Supply-chain note: pin third-party actions and images to full commit SHAs / digests
# before using this beyond a demo (the March 2026 trivy-action tag hijack,
# CVE-2026-33634, is the reason this workflow runs Trivy from a pinned image tag).

on:
  pull_request:
  pull_request_review:
    types: [submitted]        # re-evaluate PCI 6.2.3 / ISO A.8.32 once someone approves
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compliance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.21.2
  TRIVY_IMAGE: aquasec/trivy:0.69.3
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable
  SEMGREP_VERSION: "1.182.1"
  CHECKOV_VERSION: "3.3.30"
  IMAGE: payments-api:ci

jobs:
  # ------------------------------------------------- PCI 8.6.2 · ISO A.5.17
  secrets:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan working tree for secrets
        run: |
          mkdir -p reports && chmod a+rwx reports
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            dir . --config .gitleaks.toml --redact \
            --report-format json --report-path reports/gitleaks.json --exit-code 0
      - uses: actions/upload-artifact@v4
        with: { name: report-gitleaks, path: reports/gitleaks.json }

  # ------------------------------------------------- PCI 6.2.4, 3.5.1 · ISO A.8.28, A.8.24
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "semgrep==${SEMGREP_VERSION}"
      - name: Run project rules
        run: |
          mkdir -p reports
          semgrep scan --config .semgrep/ --metrics=off \
            --exclude demo-kit --exclude compliance \
            --json -o reports/semgrep.json \
            --sarif-output reports/semgrep.sarif .
      - uses: actions/upload-artifact@v4
        with: { name: report-semgrep, path: "reports/semgrep.*" }

  # ------------------------------------------------- PCI 1.3.1, 2.2.6, 3.5.1, 4.2.1, 6.4.2, 10.2.1
  # ------------------------------------------------- ISO A.8.9, A.8.15, A.8.20, A.8.24
  iac:
    name: IaC & Dockerfile scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "checkov==${CHECKOV_VERSION}"
      - name: Scan Terraform and Dockerfile
        run: |
          mkdir -p reports
          # No --quiet: passed checks are evidence too.
          checkov -d . --framework terraform dockerfile --skip-path demo-kit \
            -o json --soft-fail > reports/checkov.json
      - uses: actions/upload-artifact@v4
        with: { name: report-checkov, path: reports/checkov.json }

  # ------------------------------------------------- PCI 6.3.1-6.3.3, 6.4.1 · ISO A.5.9, A.8.8, A.8.29
  build:
    name: Build, SBOM, image scan, DAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }

      - name: Build and test (also writes CycloneDX SBOM)
        working-directory: app
        run: mvn -B -ntp verify

      - name: Build container image
        run: docker build -t "$IMAGE" app

      - name: Scan image (OS packages + application jars)
        run: |
          mkdir -p reports && cp app/target/bom.json reports/bom.json
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/reports:/out" "$TRIVY_IMAGE" \
            image --scanners vuln --pkg-types os,library \
            --format json --output /out/trivy-image.json "$IMAGE"

      - name: Start app for DAST
        run: |
          docker run -d --name app -p 8080:8080 \
            -e CARD_FINGERPRINT_KEY="$(openssl rand -hex 32)" "$IMAGE"
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/actuator/health && exit 0; sleep 2
          done
          docker logs app; exit 1

      - name: DAST baseline (OWASP ZAP)
        run: |
          chmod a+rwx reports
          docker run --rm --network host -v "$PWD/reports:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "http://localhost:8080/api/v1/cards?customerId=cust-001" \
            -J zap.json -I || true
          test -s reports/zap.json

      - if: always()
        run: docker rm -f app || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-build
          path: |
            reports/bom.json
            reports/trivy-image.json
            reports/zap.json

  # ------------------------------------------------- the gate
  compliance-gate:
    name: Compliance gate (PCI DSS + ISO 27001)
    runs-on: ubuntu-latest
    needs: [secrets, sast, iac, build]
    if: always()
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { pattern: "report-*", path: reports, merge-multiple: true }

      - name: Collect PR review evidence (PCI 6.2.3 / ISO A.8.32)
        if: github.event.pull_request.number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
            > reports/pr-reviews.json

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml

      - name: Evaluate controls
        id: gate
        run: python compliance/aggregate.py --reports-dir reports --strict

      - name: Post matrix on the pull request
        if: always() && github.event.pull_request.number && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "${{ github.repository }}" \
            --body-file reports/compliance-matrix.md --edit-last \
          || gh pr comment "$PR" --repo "${{ github.repository }}" \
            --body-file reports/compliance-matrix.md

      - name: Upload SAST findings to code scanning
        if: always() && hashFiles('reports/semgrep.sarif') != ''
        continue-on-error: true   # needs GitHub Advanced Security on private repos
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: reports/semgrep.sarif, category: semgrep }

      - name: Archive evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-evidence-${{ github.sha }}
          retention-days: 90
          path: |
            reports/
            compliance/controls.yaml

  # ------------------------------------------------- signed release (main only)
  release:
    name: Publish signed image + SBOM attestation
    runs-on: ubuntu-latest
    needs: [compliance-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.compliance-gate.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless signing via Sigstore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -ntp -f app/pom.xml package -DskipTests
      - uses: sigstore/cosign-installer@v3
      - name: Build, push, sign and attest
        env:
          COSIGN_YES: "true"
        run: |
          REF="ghcr.io/${GITHUB_REPOSITORY,,}/payments-api:${GITHUB_SHA::7}"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$REF" app && docker push "$REF"
          DIGEST_REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$REF")
          cosign sign "$DIGEST_REF"
          cosign attest --predicate app/target/bom.json --type cyclonedx "$DIGEST_REF"
          echo "Signed $DIGEST_REF" >> "$GITHUB_STEP_SUMMARY"
